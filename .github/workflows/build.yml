name: Build NFL Model Board

on:
  schedule:
    - cron: "0 12 * * *"    # every day at 8am Eastern (12:00 UTC)
    - cron: "0 7 * * 1,2"   # plus late Sunday and Monday nights, after the games
  push:
    branches: [main]         # rebuild whenever you upload a new version
  workflow_dispatch:         # adds a "Run workflow" button for updating any time
    inputs:
      fetch_props:
        description: "Pull fresh prop lines now (uses Odds API credits)"
        type: boolean
        default: false

permissions:
  contents: write            # lets the build save history.json for the results tracker
  issues: write              # lets the build send edge alerts as GitHub notifications
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the site
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          OUTPUT_FILE: public/index.html
          FETCH_PROPS: ${{ inputs.fetch_props }}
        run: python nfl_site.py
      - name: Send edge alerts
        if: hashFiles('alerts.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Model alerts for $(TZ=America/New_York date +'%b %-d')" --body-file alerts.md
      - name: Save history (so picks can be graded after the games)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update history"
            git pull --rebase
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
